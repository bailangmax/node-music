# 构建并推送镜像, 供 mags deploy --image 使用
# 触发: push 到 main / 手动 workflow_dispatch
# 产出: ghcr.io/<owner>/node-music:main + latest + sha (支持 amd64/arm64 双架构)
name: build-image

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 QEMU 以支持多架构构建 (解决主机节点架构不匹配报错)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 规范化镜像名称（全部转为小写，防止大小写导致拉取失败）
      - name: Generate image name lowercase
        id: image_name
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "image=ghcr.io/${OWNER,,}/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-image
          cache-to: type=gha,mode=max,scope=build-image

      - name: Print image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$TAGS"
